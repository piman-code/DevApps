name = "piman-devapps"
pages_build_output_dir = "./site"
compatibility_date = "2026-10-01"

# 비밀 변수(Cloudflare에만 있음, 저장소에 없음)
# DOWNLOAD_KEY  선생님께 알려 드리는 다운로드 비밀키
# LINKS         {"blur:mac": "https://drive…", "folder": "…"} 형태의 JSON
# ADMIN_KEY     파이맨 전용 영역(/private/)을 여는 관리자 키. 다운로드 키와 다른 값

# 선생님 주문·조사 모으기(/order/, /api/order/). 다운로드·전용 영역과 무관한 별도 저장소
[[kv_namespaces]]
binding = "ORDERS"
id = "602820cffdfa4944acc84ea7da1103c3"

# 설치 파일 직접 올리기(「앱 관리」 화면, /api/files). 버킷은 비공개로 두고 공개 주소(r2.dev)는 켜지 않는다.
# 파일은 /api/get(다운로드 잠금 뒤)으로만 나간다. 무료 한도를 넘지 않게 lib/files.js가 8GB에서 올리기를 막는다.
[[r2_buckets]]
binding = "FILES"
bucket_name = "piman-devapps-files"
