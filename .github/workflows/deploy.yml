# main에 push되면 Cloudflare Pages(piman-devapps)에 배포하고 /build.txt로 확인한다.
# 맥에서 npx wrangler pages deploy를 따로 하지 않아도 된다(같이 하면 이중 배포).
# 비밀값 CLOUDFLARE_API_TOKEN(권한: Account › Cloudflare Pages › Edit), CLOUDFLARE_ACCOUNT_ID는
# GitHub 저장소 Settings › Secrets and variables › Actions에 넣는다(강의 원고 저장소와 같은 값이면 됨).
# DOWNLOAD_KEY·LINKS·ADMIN_KEY는 Cloudflare에만 있고 이 배포와 상관없다.
name: DevApps 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-devapps
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 비밀 파일 검사
        run: |
          found=$(git ls-files | grep -E '비밀키|(^|/)links\.json$|(^|/)\.dev\.vars$|(^|/)\.env' || true)
          if [ -n "$found" ]; then
            echo "::error::비밀로 보이는 파일이 저장소에 있어 배포를 멈춥니다. GitHub에서 지워 주세요: $found"
            exit 1
          fi

      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 비밀값이 없습니다. README의 '자동 배포'를 보세요."
            exit 1
          fi
          printf '%s\n' "$SHA" > site/build.txt
          # 저장소 루트에서 실행해야 functions/·lib/와 wrangler.toml(KV 바인딩)이 같이 올라간다
          npx --yes wrangler@4.157.0 pages deploy --project-name piman-devapps \
            --branch main --commit-hash "$SHA" --commit-message "$(git log -1 --format=%s "$SHA")" \
            --commit-dirty=true

      - name: 사이트 확인(/build.txt)
        env:
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsS "https://piman-devapps.pages.dev/build.txt?check=$SHA$i" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "$SHA" ]; then
              echo "### ✅ 사이트에 반영됐습니다: https://piman-devapps.pages.dev" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::배포는 끝났지만 1분이 지나도 /build.txt 가 $SHA 가 아닙니다."
          exit 1
